name: Release macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Universal macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "==> Building release ${RAW_TAG} (version ${CLEAN_VERSION})"

      - name: Run unit tests
        run: swift test

      - name: Build Universal macOS .app Bundle (arm64 + x86_64)
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x ./scripts/bundle_app.sh ./scripts/package_dmg.sh
          ./scripts/bundle_app.sh release

      - name: Package .dmg Installer & Checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package_dmg.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Maxgus Picker 1824 ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            build/maxguspicker1824-${{ steps.version.outputs.version }}.dmg
            build/maxguspicker1824-${{ steps.version.outputs.version }}.dmg.sha256
            build/maxguspicker1824.dmg
            build/maxguspicker1824.dmg.sha256
